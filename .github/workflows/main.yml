
name: Build Expert Answer AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Expert_Answer_AI_Android_Project.zip -d project
          echo "ZIP extracted. Files:"
          find project -maxdepth 4 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and build Android project
        run: |
          ROOT=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            exit 1
          fi
          echo "Project folder: $ROOT"
          gradle -p "$ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Expert-Answer-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
