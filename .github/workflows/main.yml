name: Build Expert Answer AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o Expert_Answer_AI_Android_Project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project/expert_answer_android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Expert-Answer-AI-APK
          path: project/expert_answer_android/app/build/outputs/apk/debug/*.apk
